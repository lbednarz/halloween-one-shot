<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wickermoor Village</title>
<style>
  :root {
    --ink: #f0e6d2; --ink-dim: #b9a888; --edge: #4a3f30;
    --bg: #14110d; --panel: #1e1a14; --accent: #c9a227;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    -webkit-text-size-adjust: 100%;
  }
  #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #world img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

  .marker {
    position: absolute; transform-origin: 50% 50%;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; border: 2px solid var(--ink);
    background: rgba(20,17,13,.82); color: var(--ink);
    font: 700 13px/26px ui-sans-serif, system-ui, sans-serif;
    text-align: center; letter-spacing: -.02em;
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .marker:hover { background: var(--accent); color: #14110d; border-color: var(--accent); }
  .marker.active { background: var(--accent); color: #14110d; border-color: #fff;
                   box-shadow: 0 0 0 4px rgba(201,162,39,.35); }
  .marker.dim { opacity: .25; }

  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(400px, 90vw);
    background: var(--panel); border-left: 1px solid var(--edge);
    transform: translateX(100%); transition: transform .22s ease;
    display: flex; flex-direction: column; z-index: 20;
  }
  #panel.open { transform: none; }
  #panel header {
    padding: 18px 46px 14px 20px; border-bottom: 1px solid var(--edge); flex: none;
  }
  #panel .pid { font: 700 12px ui-sans-serif, system-ui, sans-serif;
                letter-spacing: .12em; color: var(--accent); }
  #panel h2 { margin: 4px 0 0; font-size: 21px; font-weight: 600; }
  #panel .content { padding: 4px 20px 28px; overflow-y: auto; }
  #panel .content p { margin: 14px 0; }
  #panel .content ul { margin: 14px 0; padding-left: 20px; }
  #panel .content li { margin: 5px 0; }
  #panel .content .empty { color: var(--ink-dim); font-style: italic; }
  #panel .nav { display: flex; gap: 8px; padding: 12px 20px;
                border-top: 1px solid var(--edge); flex: none; margin-top: auto; }

  #index {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(280px, 85vw);
    background: var(--panel); border-right: 1px solid var(--edge);
    transform: translateX(-100%); transition: transform .22s ease;
    display: flex; flex-direction: column; z-index: 20;
  }
  #index.open { transform: none; }
  #index .head { padding: 16px 16px 12px; border-bottom: 1px solid var(--edge); flex: none; }
  #index h1 { margin: 0 44px 12px 0; font-size: 17px; font-weight: 600; }
  #closeIndex { position: absolute; top: 12px; right: 12px; }
  #index input {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--edge); background: #14110d; color: var(--ink);
    font: 14px ui-sans-serif, system-ui, sans-serif;
  }
  #index ul { list-style: none; margin: 0; padding: 8px; overflow-y: auto; }
  #index li button {
    display: block; width: 100%; text-align: left; padding: 8px 10px;
    background: none; border: 0; border-radius: 6px; color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  #index li button:hover { background: rgba(255,255,255,.06); }
  #index li button.active { background: var(--accent); color: #14110d; }
  #index li b { font: 700 12px ui-sans-serif, system-ui, sans-serif;
                letter-spacing: .06em; opacity: .75; margin-right: 8px; }

  .controls { position: absolute; z-index: 10; display: flex; gap: 6px; }
  #topleft { top: 12px; left: 12px; }
  #bottomright { bottom: 12px; right: 12px; }
  button.btn {
    min-width: 36px; height: 36px; padding: 0 12px;
    background: rgba(30,26,20,.9); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 8px;
    font: 500 14px ui-sans-serif, system-ui, sans-serif; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  #close { position: absolute; top: 12px; right: 12px; }
  @media (max-width: 640px) {
    #panel { top: auto; width: 100%; height: 62vh; border-left: 0;
             border-top: 1px solid var(--edge); transform: translateY(100%); }
    #panel.open { transform: none; }
  }
</style>
</head>

const DATA = {"image":{"file":"map.webp","width":1186,"height":1554},"regions":[{"id":"V1","x":0.4369,"y":0.69235,"title":"Green Queen Inn","body":"<p>One of the largest buildings within the village limits, the inn contains rooms for rent, a tavern and restaurant, a small theater, and an attached stable.</p><p>The Green Queen Inn is the social center for many of the residents and visitors to the village. The tavern offers a variety of drinks that cater to patrons of different tastes and means\u2014after all, it\u2019s better to drown your fears and worries in strong libations than face the horrors of Druskenvald sober. While travelers from beyond Wickermoor Hollow are exceedingly rare, this inn is the main stop for any travelers from the towns and settlements within the valley.</p><p>Additional entertainment on offer adds to the bread and circus that the inn\u2019s theater provides. It may host a lowbrow act one week and then a more intellectually stimulating performance the next. Acts are not common, but traveling entertainers who find their way here always find an attentive audience.</p><p><strong>Alda Farnum, the Innkeeper.</strong> Alda (Neutral Evil, human Noble) owns and manages the Green Queen Inn. She comes off as friendly, but everything is a transaction to her, whether the currency is coins, gems, art, skills, or favors. Even the most inattentive person doesn\u2019t need much time around Alda to see through her polite fa\u00e7ade. Her brown hair is worn up under a hat, and her perfectly tailored outfits exude an air of quiet authority.</p><p>As a young woman, Alda became disenfranchised with the Old Ways, favoring the prosperity and comfort that modernity provides. However, when she happened upon an ancient tome filled with primeval rituals that harness Kehlenn\u2019s essence, she quickly discovered that she could use such power to grow her wealth and station in life. She has since joined the cult of the Crooked Queen as a means to an end in her constant quest for riches and authority.</p>"},{"id":"V2","x":0.43292,"y":0.77704,"title":"Stables","body":"<p>Wooden stalls house the horses and mules belonging to the inn's guests. Additionally, Alda owns two horses and two mules, which she rents to people who need them.</p><p><strong>Marianna Grey, the Stablemistress.</strong> The Stable is managed by Marianna Grey (Neutral Good, human Scout), under the direction of Alda. Marianna lives in a dirty room above the Stables. She is shy around people and not considered sociable, but characters who take the time to speak with her find her kind and friendly. Marianna is one of the few people who the ingratiating Alda Farnum is rude toward, the latter thinking herself superior in every way to the stablemistress she employs.</p><p>Marianna\u2019s love of four-legged creatures makes her a member of the Fold of the Patient Lady (see chapter 8). Her work with horses and heavy equipment makes her muscular and spry, and she keeps her black hair shorn to just a few inches long.</p>"},{"id":"V3","x":0.63894,"y":0.55226,"title":"Constable\u2019s Station and Jail","body":"<p>The constable Doris Squire and deputy constable Howie Butterman work and live here. The first floor holds the offices and jail, while the second floor contains two apartments where the pair each keep residence.</p><p>The three barred cells within the jail are meant to withstand a lot of punishment, and the locks are quite sturdy. At any time, there may be a prisoner or two in the cells, temporarily incarcerated while they sleep off a bender or cool off after a violent altercation.</p><p>The mayor acts as judge and jury for more severe crimes, with punishment being harsh and swift. The most severe punishments likely consist of execution for murders or banishment in the cases of grand larcenies, theft, or other crimes considered too egregious to be punished with only a fine.</p><p><strong>Doris Squire, the Constable.</strong> Constable Doris Squire (Lawful Neutral, human Knight) is pragmatic, laconic, and plainly dressed. She\u2019s tall and stocky, wearing her graying hair under a cap. Her steely gray eyes are alert and seem capable of peering through one\u2019s soul.</p><p>She makes a habit of speaking only when necessary, using the fewest words possible to get her point across. She leaves the niceties of community relations to her more affable deputy.</p><p>Doris openly enforces the laws of the Old Ways, but in her heart, she is one of the Fold of the Patient Lady, enjoying and maintaining a cordial relationship with the wonders of nature. Despite her stoic guise, she is a sensitive soul and secretly writes poetry to express her feelings.</p><p><strong>Howie Butterman, the Deputy.</strong> Howie Butterman (Neutral Evil, human Spy) is short and wiry, and his brown hair sticks out from his uniform cap. While he doesn\u2019t look imposing, he is quick and deadly in a fight.</p><p>Deputy Howie presents himself as the more affable of the law-enforcement duo. His friendly demeanor and helpful attitude make him more suitable than the constable at dealing with the public. He plays \u201cgood cop\u201d to Constable Doris\u2019s \u201cbad cop\u201d when dealing with lawbreakers.</p><p>In reality, Deputy Howie is a fervent cult member who works behind the scenes to bring about the return of the Crooked Queen. He uses his position of authority to move events very subtly toward her return. The arrival of Phillip and Adela triggers him and the other servants of the Crooked Queen to put their plans into action (see chapter 8).</p>"},{"id":"V4","x":0.63113,"y":0.67488,"title":"Mayor\u2019s Home and Office","body":"<p>The mayor of Wickermoor Village has robust offices attached to a modest manor home. The living quarters are off-limits except to those invited by the mayor, but the offices are open for business from the Twilight Hour through the Nightfall Hour. The home is inhabited by the town\u2019s mayor, Wendel Somerton, along with his wife, Myrtle, and their daughter, Rose.</p><p>The bulk of the office space in the mayoral offices is set aside for records and other official paperwork. The current mayor, Wendel Somerton, relishes his position and the power that it gives him; therefore, not much happens in town that isn\u2019t recorded and catalogued. If there isn\u2019t a form for something, Mayor Somerton will create a form to make sure everything is in order and under his auspices.</p><p><strong>Wendel Somerton, the Mayor.</strong> Mayor Somerton (Lawful Neutral, human Priest) is an officious, self-important man of 50 years. His short, wide frame is constantly clad in finely tailored suits that barely hold his ever-growing girth. He wears a matching bowler hat on his bald head, and his bushy gray eyebrows and handlebar mustache are waxed to maintain their shapes. His cravats are decorated with a jeweled pin in the form of an oak leaf. He does not need, but always carries, a mahogany cane with an emerald handle.</p><p>While he is tolerant and even welcoming to people of all ideologies, Mayor Somerton strongly believes in the Old Ways along with his family. However, he is completely ignorant of the wicked intentions of the cult of the Crooked Queen and only knows Kehlenn as the Green Queen, whom he deeply reveres. He serves as the leader of the Followers of the Old Ways, leading worship of the Green Queen and heading the rituals and rites to harness her power.</p><p>This has made him a useful pawn of the nefarious cult of the Crooked Queen, unknowingly enacting the plans of her servants. The most impactful of these decisions was the gifting of the Lockwood Estate to Phillip Druskenvald and preparing for his potential arrival. While most townsfolk, and even Wendel himself, viewed the move as a political maneuver, the idea was planted in his head by Randall Graham (see area V7), who knows that Phillip is the critical piece of the final ritual to free the Crooked Queen and unleash the Horned King.</p>"},{"id":"V5","x":0.38931,"y":0.66513,"title":"Tolliver\u2019s Trading Post","body":"<p>Although Wickermoor Hollow doesn\u2019t see a great deal of travel and trade with the other provinces of Druskenvald, anything that might be of value to the good folks of Wickermoor Village can be found at the trading post. From the staples of people\u2019s diet to the more exotic goods like simple weapons and trade goods, Baltus Tolliver either has it or knows how to get it.</p><p>Goods that might tempt passersby are displayed in a large front area, with extra supplies stored in the back room and in the basement. Baltus lives on the second floor, and he employs two guards, Wilma and Ronald Wainwright (Lawful Neutral, human Guards), who have a living area in the basement for when they are not on duty. This married couple devoutly follows the Old Ways but are ignorant of their employer\u2019s sinister allegiances.</p><p>Wilma and Ronald care for three adopted children, each originally from another community in Wickermoor Hollow\u2014Victoria from Dawn\u2019s Gate, Eddie from Murkwater Bend, and most recently, Zachariah from Foxwillow (Neutral Good, human noncombatant Commoners). All three attend school and help with chores around the shop. The birth parents of all three children went missing, and only Wilma and Ronald know that the disappearances were caused by the Fallen that each terrorize their respective home communities.</p><p><strong>Baltus Tolliver, the Merchant.</strong> Baltus Tolliver (Neutral Evil, human Cultist Fanatic) left Wickermoor Village and traveled across Druskenvald as a young man. He returned a decade later with some wealth, a whole lot of lavish goods, and the contacts to find any strange oddity across the domain. Using a blend of charm and intimidation, Baltus established the largest trading post in the hollow. He sells everything from basic goods to rare trinkets.</p><p>He is a slender man who wears the same gray suit every night, making sure it is meticulously cleaned every evening. He\u2019s clean-shaven, and his thinning black hair betrays his upper middle age. He wears plain silver rings and smokes a decoratively carved mahogany pipe.</p><p>Although he spent his youth away from Wickermoor Hollow, Baltus is a Follower of the Old Ways that serves in the cult of the Crooked Queen. He was called home by the ever-growing strength of Kehlenn, and his wealth and trading power help fund and coordinate efforts to unleash her. His guards revere the Old Ways and the Green Queen, but they are unaware of Baltus\u2019s allegiance to the wicked cult.</p>"},{"id":"V6","x":0.26068,"y":0.70406,"title":"Apothecary Shop","body":"<p>Morgan\u2019s Apothecary Shop includes a small area in the front to hold consultations for alchemical services, while the rest of the building contains a large workshop with all the ingredients and equipment needed to carry out their profession.</p><p>The reagents, ointments, and salves that Morgan uses in their work don\u2019t have any true medicinal value on their own, but the people of Wickermoor Village swear by Morgan\u2019s concoctions. They also offer common magical brews like Potions of Healing, as well as any of the Paranormal Potions .</p><p>There are no living quarters within the apothecary shop building, and it\u2019s not unusual to see Morgan cooking a meal using the same equipment they use to mix strange concoctions. Oddly, there is no bed in the private chambers Morgan uses when not at work. Where they sleep, no one knows.</p><p><strong>Morgan, the Apothecary.</strong> Morgan (Neutral, human Druid) does not remember their childhood. They awoke one night in Wickermoor Village as a youngster before being taken in by a goatherd and raised by his family. Morgan found their affinity for alchemy along the way, and they now act as the village\u2019s apothecary. They are friendly and kind, but they also suffer from blackouts and occasional lost time.</p><p>Morgan has a slight frame, with reddish-blonde hair that hangs over a thin face and green eyes that have a faraway look, even when they are concentrating on a task.</p>"},{"id":"V7","x":0.4369,"y":0.54489,"title":"Randall\u2019s Barber Shop","body":"<p>Randall Graham keeps a clean establishment, as he often needs to perform minor surgeries along with the typical haircuts. In addition to his pair of chairs, Randall has created a place where people can socialize. The moonshine he makes on-site in a homemade still serves equally well as an antiseptic or a social lubricant. He lives above his shop, although he often naps in one of his barber chairs, and he\u2019s been known to sleep there all night.</p><p><strong>Randall Graham, the Barber-Surgeon.</strong> Randall Graham (Neutral Evil, human Cultist Fanatic) is one of the most trusted folks in Wickermoor Village. Whether it\u2019s a haircut, a bothersome tooth, a quick stitch-up, a timely piece of advice, or just a friendly ear, Randall has what you need. His handsome smile, sandy brown hair and matching beard, and burly build are a fixture around town.</p><p>Randall\u2019s friendly countenance and charming ways are the perfect disguise for the town\u2019s leader of the secretive cult of the Crooked Queen that operates among the Followers of the Old Ways. He downplays his true allegiance in casual company, but he longs for Kehlenn\u2019s freedom and vengeance.</p><p>The hair, teeth, and blood he takes from his clientele are saved in a secret room in the basement of the shop for later use in rituals and spells to gain dominion over the townspeople who oppose the return of the Crooked Queen. The pigeons, centipedes, and weasels of the Vermintoll Coven often linger about the shop, fetching the pieces of the townsfolk for their hag mistresses.</p>"},{"id":"V8","x":0.36552,"y":0.5681,"title":"Wickermoor Schoolhouse","body":"<p>This veritable \u201cone-room schoolhouse\u201d holds desks, tables, books, maps, and the other tools of the trade for a teacher. In the side yard sit some rudimentary pieces of playground equipment, including a swing, climbing structures, a seesaw, and crawling tunnels. The strange and rickety play structures seem too dangerous to bring much joy.</p><p><strong>Finneas Trout, the Schoolteacher.</strong> Finneas Trout (Lawful Good, human Commoner) enthusiastically teaches the children of the area their letters and numbers, or other more esoteric subjects for the children whose parents value such things. A bookish young man, he wears spectacles under a mop of unkempt brown hair, and his physical features are unimposing. Finneas has a reverence of \u201cbook learning\u201d that is seen as admirable to some and silly to others.</p><p>He came to Wickermoor Village recently from the city of Baskerton (see chapter 1), and he keeps a room at the Green Queen Inn, paid for by the town and the parents of his more affluent students, who receive additional tutoring.</p><p>Finneas falls into the camp of the Newcomers, hoping that the pure light of reason can drive away the darkness of superstition. He has also found a source of brightness in his romantic affection for the chandler, Oswick Frey (see area V17).</p>"},{"id":"V9","x":0.5456,"y":0.59452,"title":"The Founder\u2019s Round","body":"<p>A park at the village center acts as the hub of the settlement's activity, serving as the town \"square\" despite its circular shape. Its most prominent features, apart from the flower beds, are the Oak of Many Faces (area V10) and the Founder\u2019s Statue (area V11).</p><p><strong>Old Rusty, the Groundskeeper.</strong> Old Rusty (Neutral, human Berserker, doesn\u2019t wear armor or carry weapons) is an elderly man, with a mop of reddish-gray hair and a wild beard. He\u2019s been around as long as anyone can remember, and the village gives him room and board in exchange for taking care of the Founder\u2019s Round and other public areas of town. Old Rusty rarely speaks, and when he does, he uses cryptic phrases that are difficult to decipher.</p><p>Old Rusty is, unknown to even himself, Francis Patrini, the only survivor of Eustace Lockwood\u2019s homicidal rampage years ago at the Crooked House (see chapter 12). Due to his deep connection to the supernatural happenings of the Crooked House, his motivations, goals, and allegiances can shift wildly to serve your purposes, depending on the actions of the characters.</p>"},{"id":"V10","x":0.51935,"y":0.66586,"title":"Oak of Many Faces","body":"<p>The Oak of Many Faces has stood at the center of Wickermoor Village for as long as the town has existed, and most of the inhabitants believe it to be a sacred site precious to the Green Queen. When the ultimate punishment must be carried out for a terrible crime, beheadings are conducted in front of the oak so that its roots may drink the lifeblood of the executed.</p><p>With each death, the Followers of the Old Ways carve the face of the slain into its bark. It has collected many faces over the years, making it a fascinating and grisly landmark. In truth, the tree not only consumes the blood but also the souls of those slaughtered before it, and it has gained a will of its own through the power of the Crooked Queen.</p><p>If any character is out at night alone in the Founder\u2019s Round, the Oak of Many Faces might attack as a Chaotic Evil Treant with a Speed of 0 feet, hoping to consume another soul and add a new face to its trunk. Any creature beheaded before the Oak of Many Faces or killed by it can\u2019t be resurrected by any means short of a Wish spell until the tree is destroyed.</p>"},{"id":"V11","x":0.48568,"y":0.61962,"title":"Founder\u2019s Statue","body":"<p>In the center of the Founder\u2019s Round (area V9) stands a 10-foot-tall granite statue that gives the town square its name. A plaque on the plinth of the statue says, \u201cOur Village Founder.\u201d There is no name, however. The statue is featureless, as if all the details of the statue\u2019s face and body have been weathered away. None in town know who the founder was or the circumstances of Wickermoor Village\u2019s founding.</p>"},{"id":"V12","x":0.81537,"y":0.47145,"title":"Roderick Masonry","body":"<p>This rough-built wood and stone building houses the masonry workshop and business of Solomon Roderick. The space is strewn with stone-working tools and pieces of granite, marble, and other stone.</p><p><strong>Solomon Roderick, the Stonemason.</strong> Solomon Roderick (Lawful Neutral, human Guard) is a heavyset, heavily scarred man of 40 years. His skin is as hairless and rough as the stone he works with, and his brown eyes are equally cold when dealing with strangers or customers.</p><p>Roderick lives above his workshop with his eight-year-old daughter, Sofia. Her mother left the village not long after she was born, leaving Solomon to raise the girl alone. She assists him in the shop when she\u2019s not attending Finneas Trout\u2019s lessons.</p><p>The most skilled mason in the hollow, Solomon understands his craft and the leverage that gives him. He works with subordinates who spend their time overseeing the removal of stone from the area\u2019s quarries, leaving Solomon to manage the building and maintenance of stone structures throughout Wickermoor Village.</p><p>While he comes across as cold, calculating, and strict, Solomon is as soft-hearted as they come while in private with the people he cares for. He dotes on his daughter, whose happiness and wellness are his chief goal. Solomon is a recent convert to the Brightsinger, and his newfound faith is strong, making large donations to the church and those in need.</p>"},{"id":"V13","x":0.84667,"y":0.60295,"title":"Carpentry Workshop","body":"<p>Beatrice Wells performs her carpentry here, building or repairing structures throughout Wickermoor Village as needed. She also takes on smaller projects, such as furniture, cabinets, and farming implements. Lumber, boards, and other building supplies are carefully maintained within the workshop, while more is stored outside the building, leaning against the sides of the structure.</p><p><strong>Beatrice Wells, the Carpenter.</strong> Beatrice Wells (Neutral, human Commoner) is a master carpenter and invaluable asset to Wickermoor Village. From wagons to furniture to structures, Beatrice is an expert with wood, known equally for her artistry and the sturdiness of her creations. She has a visionary quality that allows for unique and breathtaking work. She is fascinated beyond reason by the twisted architecture of the Crooked House (see chapter 12).</p><p>Beatrice, along with her husband Branden (Chaotic Good, human Commoner) and their four young children, Robin, Lark, Jay, and Wren (Neutral Good, human noncombatant Commoners), live in their second-floor living quarters.</p><p>The Wells family dutifully follow the teachings of the Brightsinger (see chapter 8). As she finds free time, Beatrice started building a chapel for Weston Murdoch on the Abandoned Church site (area V19). The Wells family dresses in bright clothes and sing songs to each other, even as they work.</p>"},{"id":"V14","x":0.56876,"y":0.52677,"title":"Bread by Holly","body":"<p>The inviting scent of baking bread\u2014as well as various sweet treats\u2014wafts from this building from early in the Twilight Hour until the start of the Nightfall Hour. A small shop at the east end of the building displays a variety of baked goods for sale.</p><p>The rear of the shop is dominated by tables, shelves, and four wood-burning ovens that are in constant use. Holly\u2019s two daughters, Violet and Lavender, help their mother at the shop when they are not at school. No one (apart from Holly) knows who the fathers were, and the rumor mill has given up on finding out. The building contains no living quarters, as Holly and her children live with the butcher Siv Harga, with whom the baker has a relationship.</p><p><strong>Holly Aster, the Baker.</strong> Holly Aster (Neutral Good, human Commoner) spends most of her time in the kitchen, either preparing the ingredients for the night\u2019s baking or fussing by the ovens. Her ruddy complexion is exacerbated by the heat of the ovens, and her straight pale hair is held back with pins while she works.</p><p>Holly comes from a long line of bakers living in Wickermoor Hollow, with her mother and her grandmother both filling the role of the bread-maker for the town. Both her mother and her grandmother died on their 35th birthdays of unknown causes, and Holly is just weeks away from hitting that milestone.</p><p>Holly is a dedicated Follower of the Old Ways, and she shares a curse with her mother and grandmother: she and her progeny are doomed to die on their 35th birthdays until the Crooked Queen returns. Holly knows this, and she has a terrible dilemma: join the cult of the Crooked Queen and help usher in the return of Kehlenn or die. How she chooses to act on that is left up to you.</p>"},{"id":"V15","x":0.26068,"y":0.77001,"title":"Harga\u2019s Meats","body":"<p>The butchery here is run by Siv Harga, a strapping woman who has become an expert in selecting and preparing meats of many kinds. The ground floor of her shop is divided evenly between the work area and the display area. Behind the shop are pens where animals that Siv has purchased from farmers for slaughter await their fate.</p><p>Siv employs a strange woman called Mrs. Oakum to help her in all aspects of the work. Mrs. Oakum leaves town each Evening and returns to town at Twilight the next night, but no one knows where she goes or what she does at night for food and shelter. The truth is Mrs. Oakum is a Chaotic Good Werewolf. She struggles against her curse and keeps the bloodlust in check by skimming scraps from the butcher shop and spending her nights far away from innocent people.</p><p><strong>Siv Harga, the Butcher.</strong> Siv Harga (Chaotic Good, human Scout) is a tall, solidly built woman with blonde hair that she keeps braided. Growing up, her family moved around Wickermoor Hollow as animal herders. Siv finally settled down in Wickermoor Village as an apprentice to the town\u2019s butcher. When he passed, she took over the business and proved to be more than adequate. Siv shares a nearby house with her partner Holly Aster, Holly's two daughters, and her younger brother Ulf (Neutral Good, human Commoner), who assists her at the shop while not in school.</p><p>Her knowledge of animals is a boon not just to her profession, but to the local farmers as well. Some think her connection with the animals she butchers is supernatural, and Siv does nothing to dissuade that attitude.</p><p>Her bond with the natural world led Siv to join the Fold of the Patient Lady. She believes that nature provides if believers are respectful and thoughtful about how to give back to nature in return. Even as she slaughters animals for her customers, she says a prayer of thanks to the Patient Lady and never allows cruelty to the animals in her care.</p>"},{"id":"V16","x":0.09958,"y":0.67338,"title":"The Smithy","body":"<p>Jean Myriel runs the smithy, where he works with a variety of metals to meet the needs of the village and the surrounding population as best he can. He is equally adept at making horseshoes, farming implements, and Simple weapons as he is working delicate gold jewelry and silver candlesticks. The second floor of the smithy contains storage and living quarters for Jean.</p><p><strong>Jean Myriel, the Smith.</strong> Jean Myriel (Lawful Good, human Berserker) emigrated to Wickermoor Village from Dawn\u2019s Gate several years ago. The unique methods with metalwork and strange designs he developed in his apprenticeship were seen as too bizarre and unorthodox for the conservative community. Stealing away in the dead of night and heading east, he found a home in Wickermoor Village.</p><p>While he once kept his beard wild and untamed, he\u2019s recently made the decision to trim his facial hair to make himself more \u201cpresentable.\u201d His shorter frame belies a mass of muscles beneath.</p><p>He is sure of himself and his skills, but he also knows when to accept the advice of others. After leaving the faith of the Crimson Rose behind in Dawn\u2019s Gate (see chapter 14), he has remained non-religious and upholds the ideals of the Newcomers.</p>"},{"id":"V17","x":0.20509,"y":0.5871,"title":"The Wickery","body":"<p>This chandlery is run by Oswick Frey. The building acts as a workshop, storage area, and living quarters. Its proximity to the butcher shop makes access to the fat used in candle-making quite convenient.</p><p>The two-story building is designed with ramps rather than stairs to accommodate Wick\u2019s wheeled chair. A rooftop lookout gives one of the best vantages of the village and surrounding area, except for the clock tower (area V25).</p><p><strong>Oswick Frey, the Chandler.</strong> Most of the candles in town are made by Oswick (Chaotic Good, human Commoner), a young man who loves his job. Having lost the use of his legs as a child, Oswick moves with the aid of a special chair designed and perfected by himself and other tradespeople of the town. Wick\u2019s bright red hair and pale complexion helped earn him his nickname as much as his job.</p><p>Oswick is madly in love with Finneas Trout (see area V8), the schoolteacher, but he has kept the feelings to himself. Oswick\u2019s gregarious personality and fondness for sharing stories turns into awkward stammering in Finneas\u2019s presence.</p><p>Oswick is a member of the Followers of the Old Ways and provides free candles to the faithful around town so they may use them to conduct numerous rituals in honor of the Green Queen.</p>"},{"id":"V18","x":0.4711,"y":0.4997,"title":"A Stitch in Time","body":"<p>A large window display shows colorful and imaginative pieces of apparel, denoting that this shop houses a clothier and tailor. The sign hanging outside the shop, reading \u201cA Stitch in Time,\u201d confirms this.</p><p>The owner and proprietor, Thomasin Ardor, designs fanciful and beautiful outfits. Unfortunately, the clientele available to her are generally only interested in plain and functional clothing. Thomasin also dabbles in shoe repair.</p><p>The shop\u2019s main floor is a showroom and work area. Upstairs are living quarters and a storage area, the latter containing bolts of cloth among other tailoring supplies.</p><p><strong>Thomasin Ardor, the Tailor.</strong> Thomasin Ardor (Neutral, human Commoner) is the village\u2019s most proficient tailor. As a child, she fell through a large pane of glass, but her life was saved with a critical medical procedure. This trauma, in conjunction with her quiet and cool disposition, leaves her the brunt of unfounded rumors and gossip.</p><p>She often keeps folks at a distance, and the only person in town she is close with is Randall Graham (see area V7), who stitched her up following her childhood accident.</p><p>While Thomasin is a benevolent member of the Followers of the Old Ways and reveres the Green Queen, Randall Graham is attempting to leverage their relationship to subtly guide her into joining the cult of the Crooked Queen. Whether she falls to wickedness or discovers Randall\u2019s plot and rebuffs him is up to you.</p>"},{"id":"V19","x":0.20799,"y":0.50266,"title":"Abandoned Church","body":"<p>This area contains the foundation and partial walls of a church originally built from marble and granite. The building is still somewhat intact, but all the furnishings are gone, the wooden windows and doors are newly refitted, and cloth tarps cover holes where there were once glass windows. New wooden construction shows that the place is in the first stages of reclamation.</p><p>Watching over the altar is an 8-foot-tall statue of a praying knight with a sour grimace on his face. The villagers call him the Man in Marble and describe him as a mythical protector of Wickermoor Village from a better age, attributing the sneer on his face to his distaste for how times have changed.</p><p>No one in town knows to what or whom the church was originally dedicated, but recently a pilgrim named Weston Murdoch came to town with his wife, Joan, and his children, Peter and Charlotte. Following his arrival, he repurposed the Abandoned Church as a place of worship to the Brightsinger after attributing the presence of songbirds roosting in the ruined rafters as a sign of his deity\u2019s blessing.</p><p><strong>Weston Murdoch, the Pilgrim.</strong> Weston Murdoch (Lawful Good, human Priest) had his eyes opened to the power of goodness and forgiveness as a young child. His parents were both criminals who died for their crimes, and Weston was taken in by a loving family who taught him the path of light. He now strives to bring that same hope and redemption to others.</p><p>He is a charismatic man in his late twenties with sandy hair, blue eyes, and a personality that lights up a room the moment he enters. His wife and children, equally beaming and exuberant, make a powerful team of missionaries.</p><p>Weston is the leader of the Brightsingers in Wickermoor Village. The flocks of beautiful songbirds that congregate around his home are constantly at odds with the pigeons who occupy the Dovecote (area V21).</p>"},{"id":"V20","x":0.62348,"y":0.45604,"title":"Post Office","body":"<p>The Post Office is maintained by Theodora Mayville, who uses a bevy of carefully trained carrier pigeons to maintain a message service between Wickermoor Village and other towns in the valley, as well as larger towns from other regions.</p><p>The Post Office contains a mess of letters, messages, tiny scrolls, and small packages. Some of the parcels and packages are delivered via wagon, but many of the messages and missives are small enough to send via pigeon. Her assistant, Geneva Fairchild, handles these deliveries and is rarely seen within Wickermoor Village. When Theodora is not present, Geneva handles the business whenever she isn\u2019t traveling.</p><p>Theodora maintains a separate residence on the outskirts of town, and she spends much of her free time in the company of the pigeons in the Dovecote (area V21).</p><p><strong>Theodora Mayville, the Postmaster.</strong> Theodora Mayville is a woman in her early 30s with a tall, slender build. She has white-blonde hair that\u2019s always set in a single ponytail, but it often falls into disarray under a brown leather hat. Her violet eyes are sharp and kind. She wears plain brown clothes and gold earrings in the shape of pigeons. She cherishes her beloved carrier pigeons as her children, and one of her birds is often roosting on her shoulder.</p><p>Theodora is really Golub Graygullet, the Pigeon Hag and leader of the Vermintoll Coven. She alters or doctors every single letter that comes and goes from Wickermoor Village, ensuring the information in the town is controlled as much as its people\u2019s minds. When the characters discover her true identity, it triggers the events in chapter 20. She won\u2019t hesitate to discreetly aid the characters in seeking out and killing her sisters Vessla (see chapter 12) and Stonoga (see chapter 16) in the name of furthering the Crooked Queen\u2019s machinations.</p>"},{"id":"V21","x":0.66158,"y":0.26426,"title":"Dovecote","body":"<p>This surprisingly large Dovecote is a haven for the pigeons used to deliver messages for the post. The cooing and fluttering isn\u2019t as loud as one might expect. In addition to the coops and cages that hold the birds, additional storage space for the Post Office (area V20) is found here.</p><p>The peaceful visage of the Dovecote is a mere illusion; it is actually the horrific lair of Golub Graygullet, the pigeon hag of the Vermintoll Coven. The Dovecote is bewitched to sprout enormous pigeon legs that allow it to rise from the ground and walk across Wickermoor Hollow. This only occurs in chapter 20 after Theodora Mayville\u2019s true identity is revealed.</p><p><strong>Peeping Albert, the Pigeon Familiar.</strong> Peeping Albert (Vermin Familiar (Pigeon) ) is a grotesque pigeon with human-like ears and human hands for talons serving as the familiar of the hag Golub Graygullet. Albert acts as the hag\u2019s eyes and ears both in town and over the length and breadth of Wickermoor Hollow. The presence of the songbirds, which arrived shortly after Weston Murdoch and the rest of the Brightsinger worshipers, has made Peeping Albert particularly cross.</p>"},{"id":"V22","x":0.84218,"y":0.89523,"title":"Shade Funeral Home","body":"<p>One of the most striking buildings in Wickermoor Village, this black marble structure is home to the undertaker Mori Shade. The basement of the building contains the workshop used to prepare bodies for their final rest in Maidenmist Cemetery (see chapter 19) to the southeast of town, as well as a chilled vault for storing the recently deceased. The main floor contains meeting areas and places for ceremonies to be held. The second floor contains storage areas for equipment and coffins, as well as Mori\u2019s living quarters.</p><p><strong>Mori Shade, the Undertaker.</strong> Mori Shade (Neutral, human Scout) deals in death. Rather than making her an outcast in the town, she\u2019s earned the respect of the people. They trust her to handle their remains with dignity and respect. She takes an interest in the various beliefs of the people, making her a good source of folklore.</p><p>A slight woman of indeterminate age, Mori has a stately, if grim, bearing. Her striking white hair is contrasted by an all-black wardrobe.</p><p>Mori does not follow the faiths of Wickermoor Hollow. Instead, she adheres to the spiritual beliefs of the Strangers (see \u201cThe Shroud\u201d in chapter 1) who serve as ferrymen of the dead. She learned much of these beliefs from Yorgrim, the gravedigger (see chapter 19), with whom she works closely in giving the dead their proper burial.</p>"},{"id":"V23","x":0.27323,"y":0.5864,"title":"Antique Bookstore","body":"<p>The main areas of this building contain Books of all shapes, subjects, genres, and varieties. The shop also sells Paper, Parchment, Ink, Ink Pens, and other supplies used in writing.</p><p>The second story contains the tools for bookbinding, ink-making, and the creation of paper and parchment. It also contains the living quarters for its owner, Eleanor Heyling.</p><p><strong>Eleanor Heyling, the Antiquarian.</strong> Eleanor Heyling\u2019s (Lawful Neutral, human Noble) love of rare books is readily apparent to anyone who enters her shop and spots her nose-deep in her newest acquisition. She will not sell a book until she\u2019s read it. Some claim that she has been cursed by her reading, while others claim she\u2019s gained magical powers from the pursuit of rigorous study.</p><p>Although she is only in her early 40s, Eleanor has the look of an older woman. A life of little sleep and eye strain has left her far-sighted and sickly. She adopted her younger sister\u2019s three children: Margery, Algernon, and Sheridan (Neutral Good, human noncombatant Commoners). They go to school on most nights but are otherwise left to their own devices by their eccentric aunt. In fact, they often end up caring for her more than she cares for them.</p><p>Although Eleanor has lived in Wickermoor Village all her life, she is staunchly in the camp of the Newcomers. She values all knowledge and the wisdom her collection has imparted upon her, remaining skeptical of the strange rituals and beliefs of the other factions in town.</p>"},{"id":"V24","x":0.19341,"y":0.24691,"title":"Druskenvald Estate","body":"<p>Resting on a hill overlooking Wickermoor Village, the recently named Druskenvald Estate sits like an overgrown weed waiting to be plucked. The highlight of the grounds is the manor itself, which is called \u201cthe Crooked House\u201d by the townsfolk due to its strangely askew construction.</p><p>Once called the Lockwood Estate, the manor had been long abandoned until recently. Mayor Somerton decided to gift the estate to Phillip Druskenvald in the unlikely hope that the lord of the land might finally visit his humble village. He even used public funds to keep it maintained and tasked the Jenkin family to move in and be ready to serve as the Druskenvalds\u2019 servants. More about the Crooked House and the Jenkins can be found in chapter 12.</p>"},{"id":"V25","x":0.66494,"y":0.62836,"title":"Haunted Clocktower","body":"<p>The tall tower attached to the mayor\u2019s home and office contains the town\u2019s clock. It has always kept perfect time, but its bell occasionally strikes at random times, which always brings strange happenings.</p><p>If you wish to randomly determine when the clock will experience a haunted strike, roll a d12 when the characters finish a Long Rest. That night, from the Evening Hour through the Witching Hour, the random strike will occur during the hour that was rolled. As soon as the strike occurs, a restless spirit will make itself known to the characters, whether through strange noises, moving objects, appearing before them, or fully manifesting and attacking as a Ghost.</p>"},{"id":"V26","x":0.93714,"y":0.67694,"title":"","body":""},{"id":"V27","x":0.64735,"y":0.79572,"title":"","body":""},{"id":"V28","x":0.376,"y":0.42429,"title":"","body":""}]};

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const panel = document.getElementById('panel');
const index = document.getElementById('index');
const list  = document.getElementById('list');

const IMG_W = DATA.image.width, IMG_H = DATA.image.height;
world.style.width = IMG_W + 'px';
world.style.height = IMG_H + 'px';

let scale = 1, tx = 0, ty = 0, minScale = 1;
const MAX_SCALE = 8;
let active = null;

/* ---------- markers ---------- */
const markers = DATA.regions.map((r, i) => {
  const el = document.createElement('button');
  el.className = 'marker';
  el.style.left = (r.x * 100) + '%';
  el.style.top  = (r.y * 100) + '%';
  el.textContent = r.id;
  el.title = r.title || r.id;
  el.addEventListener('click', e => { e.stopPropagation(); select(i, true); });
  world.appendChild(el);
  return el;
});

/* Ids longer than two characters need a wider pill than a circle. */
markers.forEach(el => {
  if (el.textContent.length > 2) {
    el.style.width = 'auto';
    el.style.padding = '0 9px';
    el.style.borderRadius = '15px';
    el.style.marginLeft = '0';
    el.style.transform = 'translateX(-50%)';
  }
});

/* ---------- transform ---------- */
/* The open panels cover part of the stage. Treat what's left as the usable
   area, so a marker near the edge of the map can still be brought into view
   instead of being pinned underneath a panel. */
function insets() {
  const wide = stage.clientWidth > 640;
  const open = panel.classList.contains('open');
  return {
    l: wide && index.classList.contains('open') ? index.offsetWidth : 0,
    r: wide && open ? panel.offsetWidth : 0,
    b: !wide && open ? panel.offsetHeight : 0,
  };
}

function clamp() {
  const { l, r, b } = insets();
  const availW = stage.clientWidth - l - r, availH = stage.clientHeight - b;
  const w = IMG_W * scale, h = IMG_H * scale;
  // Centre within the usable area when the map is smaller than it, otherwise
  // keep the image covering that area so it can never be dragged off-screen.
  tx = w <= availW ? l + (availW - w) / 2 : Math.min(l, Math.max(l + availW - w, tx));
  ty = h <= availH ? (availH - h) / 2 : Math.min(0, Math.max(availH - h, ty));
}

function render() {
  clamp();
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  const inv = 1 / scale;
  markers.forEach(el => {
    const base = el.style.marginLeft === '0px' ? 'translateX(-50%) ' : '';
    el.style.transform = base + `scale(${inv})`;
  });
}

function fit() {
  minScale = Math.min(stage.clientWidth / IMG_W, stage.clientHeight / IMG_H);
  scale = minScale;
  tx = (stage.clientWidth - IMG_W * scale) / 2;
  ty = (stage.clientHeight - IMG_H * scale) / 2;
  render();
}

function zoomAt(cx, cy, factor) {
  const next = Math.max(minScale, Math.min(MAX_SCALE, scale * factor));
  if (next === scale) return;
  // Keep the point under the cursor fixed.
  tx = cx - (cx - tx) * (next / scale);
  ty = cy - (cy - ty) * (next / scale);
  scale = next;
  render();
}

/* ---------- pan & zoom input ---------- */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

const pointers = new Map();
let pinchDist = 0, moved = false;

stage.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.setPointerCapture(e.pointerId);
  if (pointers.size === 1) { moved = false; stage.classList.add('dragging'); }
  if (pointers.size === 2) pinchDist = spread();
});

stage.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    tx += dx; ty += dy; render();
  } else if (pointers.size === 2) {
    const d = spread();
    if (pinchDist > 0) {
      const [a, b] = [...pointers.values()];
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinchDist);
    }
    pinchDist = d;
    moved = true;
  }
});

function spread() {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('click', () => {
  if (moved) return;
  index.classList.remove('open');
  deselect();
});

/* ---------- selection ---------- */
/* Deep links like map.html#V12 open straight to a location. Some browsers
   refuse replaceState on file:// URLs, so failing here must stay harmless. */
function setHash(h) {
  try { history.replaceState(null, '', h || location.pathname + location.search); }
  catch (e) { /* ignore */ }
}

function select(i, fly) {
  active = i;
  const r = DATA.regions[i];
  setHash('#' + r.id);
  markers.forEach((el, j) => el.classList.toggle('active', j === i));
  [...list.children].forEach((li, j) =>
    li.firstChild.classList.toggle('active', j === i));

  document.getElementById('pid').textContent = r.id;
  document.getElementById('ptitle').textContent = r.title || 'Unnamed location';
  document.getElementById('pbody').innerHTML = r.body ||
    '<p class="empty">No description yet &mdash; add one under a <code>## ' +
    r.id + '</code> heading in your key file and rebuild.</p>';
  panel.classList.add('open');
  if (fly !== false) flyTo(r);
}

function flyTo(r) {
  const target = Math.max(scale, minScale * 2.6);
  // Aim at the centre of the strip of map left visible by the open panels.
  const ins = insets();
  const anchorX = ins.l + (stage.clientWidth - ins.l - ins.r) / 2;
  const anchorY = (stage.clientHeight - ins.b) / 2;
  scale = target;
  tx = anchorX - r.x * IMG_W * scale;
  ty = anchorY - r.y * IMG_H * scale;
  // Markers are counter-scaled, so they must ease on the same curve as the map
  // or they snap to their final size while the map is still moving.
  glide(true);
  render();
  setTimeout(() => glide(false), 320);
}

function glide(on) {
  const t = on ? 'transform .3s ease' : '';
  world.style.transition = t;
  markers.forEach(el => el.style.transition = t);
}

function deselect() {
  active = null;
  setHash('');
  panel.classList.remove('open');
  render();
  markers.forEach(el => el.classList.remove('active'));
  [...list.children].forEach(li => li.firstChild.classList.remove('active'));
}

function step(delta) {
  if (active === null) return;
  select((active + delta + DATA.regions.length) % DATA.regions.length);
}

/* ---------- index list ---------- */
DATA.regions.forEach((r, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.innerHTML = '<b></b><span></span>';
  b.querySelector('b').textContent = r.id;
  b.querySelector('span').textContent = r.title || 'Unnamed location';
  b.addEventListener('click', () => {
    select(i);
    if (window.innerWidth <= 640) index.classList.remove('open');
  });
  li.appendChild(b);
  list.appendChild(li);
});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  DATA.regions.forEach((r, i) => {
    const hay = (r.id + ' ' + (r.title || '') + ' ' + (r.body || '')).toLowerCase();
    const hit = !q || hay.includes(q);
    list.children[i].style.display = hit ? '' : 'none';
    markers[i].classList.toggle('dim', !hit);
  });
});

/* ---------- controls ---------- */
const centre = () => [stage.clientWidth / 2, stage.clientHeight / 2];
document.getElementById('zoomIn').onclick  = () => zoomAt(...centre(), 1.5);
document.getElementById('zoomOut').onclick = () => zoomAt(...centre(), 1 / 1.5);
document.getElementById('reset').onclick   = () => { deselect(); fit(); };
document.getElementById('close').onclick   = deselect;
document.getElementById('prev').onclick    = () => step(-1);
document.getElementById('next').onclick    = () => step(1);
document.getElementById('toggleIndex').onclick = () => { index.classList.toggle('open'); render(); };
document.getElementById('closeIndex').onclick  = () => { index.classList.remove('open'); render(); };

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') { e.target.value = ''; e.target.dispatchEvent(new Event('input')); e.target.blur(); }
    return;
  }
  const k = e.key;
  if (k === 'Escape') { index.classList.remove('open'); deselect(); }
  else if (k === '0') { deselect(); fit(); }
  else if (k === '+' || k === '=') zoomAt(...centre(), 1.5);
  else if (k === '-') zoomAt(...centre(), 1 / 1.5);
  else if (k === 'l' || k === 'L') index.classList.toggle('open');
  else if (k === 'ArrowRight' || k === 'j') step(1);
  else if (k === 'ArrowLeft'  || k === 'k') step(-1);
});

addEventListener('resize', () => {
  const wasMin = Math.abs(scale - minScale) < 1e-6;
  minScale = Math.min(stage.clientWidth / IMG_W, stage.clientHeight / IMG_H);
  if (wasMin || scale < minScale) fit(); else render();
});

function start() {
  fit();
  const want = decodeURIComponent(location.hash.slice(1));
  const i = DATA.regions.findIndex(r => r.id === want);
  if (i >= 0) select(i, true);
}

const img = document.getElementById('map');
if (img.complete) start(); else img.addEventListener('load', start);
</script>
</body>
</html>
