<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Hollow Vigil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>
  <dialog id="spell-dialog"></dialog>

  <script src="lore.js"></script>
  <script src="spells.js"></script>
  <script src="characters.js"></script>
  <script>
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const img = (path) => encodeURI(path);
    const PREMISE = LORE.premise;
    // Lore for a character, with fallbacks if its .md file is missing.
    const lore = (c) => LORE.characters[c.id] || { name: c.id, epithet: "", html: "<p>No lore file yet.</p>" };

    function renderHome() {
      document.title = PREMISE.title;
      app.innerHTML = `
        <header class="premise">
          <p class="tagline">${esc(PREMISE.tagline)}</p>
          <h1>${esc(PREMISE.title)}</h1>
          <div class="rule"><span>✦</span></div>
          <div class="prose">${PREMISE.html}</div>
        </header>
        <section class="roster">
          ${CHARACTERS.map((c) => `
            <a class="card" href="#/${c.id}">
              <div class="card-img"><img src="${img(c.image)}" alt="" loading="lazy"></div>
              <span class="card-name">${esc(lore(c).name)}</span>
            </a>`).join("")}
        </section>
        ${voteSection()}
        <footer class="dm-link">${LORE.dmNotes ? `<a href="#/dm-notes">DM Notes</a> · ` : ""}<a href="#/votes">Vote Results</a></footer>`;
      loadVoters();
    }

    // ---------- voting (needs the hosted site: build.py --serve) ----------
    const canVote = location.protocol !== "file:";
    function voteSection() {
      const options = `<option value="">Choose…</option>` +
        CHARACTERS.map((c) => `<option value="${c.id}">${esc(lore(c).name)}</option>`).join("");
      return `<section class="vote">
        <h2>Cast Your Vote</h2>
        <p>Rank the three characters you'd most like to play. Submitting again under the same name replaces your ballot.</p>
        <form data-vote>
          <label class="vote-name">Your name <input name="name" maxlength="40" autocomplete="name" required></label>
          ${["1st", "2nd", "3rd"].map((r) => `<label>${r} choice <select name="pick" required>${options}</select></label>`).join("")}
          <button ${canVote ? "" : "disabled"}>Submit ballot</button>
          <p class="vote-msg">${canVote ? "" : "Voting works on the hosted site, not when opening the file directly."}</p>
        </form>
        <p class="voters" id="voters"></p>
      </section>`;
    }
    async function loadVoters() {
      if (!canVote) return;
      try {
        const { voters } = await (await fetch("/api/voters")).json();
        const el = document.getElementById("voters");
        if (el) el.textContent = voters.length ? `Voted so far: ${voters.join(", ")}` : "No votes yet.";
      } catch {}
    }
    async function postJSON(url, body) {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return { ok: res.ok, data: await res.json().catch(() => ({})) };
    }

    document.addEventListener("submit", async (e) => {
      const form = e.target.closest("form[data-vote]");
      if (!form) return;
      e.preventDefault();
      const msg = form.querySelector(".vote-msg");
      const name = form.elements.name.value.trim();
      const picks = [...form.querySelectorAll('select[name="pick"]')].map((s) => s.value);
      if (new Set(picks).size !== 3) return void (msg.textContent = "Pick three different characters.");
      msg.textContent = "Sending…";
      try {
        const { ok, data } = await postJSON("/api/vote", { name, picks });
        msg.textContent = ok ? (data.replaced ? `Updated your ballot, ${name}.` : `Thanks, ${name}! Your vote is in.`) : data.error || "Something went wrong.";
        if (ok) loadVoters();
      } catch {
        msg.textContent = "Couldn't reach the server.";
      }
    });

    // DM-only results page, unlocked with the master password (reuses one entered this tab).
    const nameOf = (id) => lore(CHARACTERS.find((c) => c.id === id) || { id }).name;
    function renderVotes() {
      document.title = `Vote Results · ${PREMISE.title}`;
      app.innerHTML = `
        <nav class="topnav"><a href="#/">← Roster</a></nav>
        <article class="notes">
          <h2>Vote Results</h2>
          <form class="unlock" data-results>
            <input type="password" placeholder="DM password" autocomplete="off" aria-label="DM password">
            <button>Show results</button><p class="unlock-msg"></p>
          </form>
          <div id="results"></div>
        </article>`;
      const saved = savedPasswords().master;
      if (saved) showResults(saved);
    }
    async function showResults(password) {
      const form = document.querySelector("form[data-results]"), msg = form?.querySelector(".unlock-msg");
      if (!canVote) return void (msg.textContent = "Results are only available on the hosted site.");
      const { ok, data } = await postJSON("/api/results", { password }).catch(() => ({ ok: false, data: { error: "Couldn't reach the server." } }));
      if (!ok) return void (msg.textContent = data.error || "Something went wrong.");
      rememberPassword(null, "master", password);
      form.remove();
      const voted = data.tally.filter((t) => t.points > 0);
      document.getElementById("results").innerHTML = `
        <p class="note">${data.ballots.length} ballot${data.ballots.length === 1 ? "" : "s"}. Scoring: 1st = 3 points, 2nd = 2, 3rd = 1.</p>
        <table class="attacks results">
          <tr><th>Character</th><th>Points</th><th>1st</th><th>2nd</th><th>3rd</th></tr>
          ${(voted.length ? voted : data.tally).map((t) => `<tr><td>${esc(nameOf(t.id))}</td><td>${t.points}</td><td>${t.first}</td><td>${t.second}</td><td>${t.third}</td></tr>`).join("")}
        </table>
        <h3 class="ballots-head">Ballots</h3>
        <table class="attacks results">
          <tr><th>Name</th><th>1st</th><th>2nd</th><th>3rd</th><th>When</th></tr>
          ${data.ballots.map((b) => `<tr><td>${esc(b.name)}</td>${b.picks.map((p) => `<td>${esc(nameOf(p))}</td>`).join("")}<td>${esc(b.submitted)}</td></tr>`).join("") || `<tr><td colspan="5">No votes yet.</td></tr>`}
        </table>`;
    }
    document.addEventListener("submit", (e) => {
      const form = e.target.closest("form[data-results]");
      if (!form) return;
      e.preventDefault();
      form.querySelector(".unlock-msg").textContent = "Checking…";
      showResults(form.querySelector("input").value);
    });

    // ---------- encrypted secrets ----------
    // lore.js holds secrets as { iter, iv, ct, slots: [{ who, salt, iv, key }] } (see build.py).
    // A password unwraps a slot's key, which decrypts the text. Unlocked text and working
    // passwords are kept only for this browser tab.
    const unlocked = new Map();  // secret id -> decrypted html
    const b64d = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
    const pwKey = "hollow-vigil:passwords";
    function savedPasswords() {
      try { return JSON.parse(sessionStorage.getItem(pwKey)) || {}; } catch { return {}; }
    }
    function rememberPassword(id, who, password) {
      const saved = savedPasswords();
      saved[who === "master" ? "master" : id] = password;
      try { sessionStorage.setItem(pwKey, JSON.stringify(saved)); } catch {}
    }

    async function decryptSecret(enc, password) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      for (const slot of enc.slots) {
        try {
          const kek = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: b64d(slot.salt), iterations: enc.iter, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(slot.iv) }, kek, b64d(slot.key));
          const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
          const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(enc.iv) }, key, b64d(enc.ct)));
          return { html, who: slot.who };
        } catch {}  // wrong password for this slot; try the next
      }
      return null;
    }

    // Collapsible secret box: decrypted text if unlocked this tab, otherwise a password form.
    function secretBox(id, label) {
      const body = unlocked.has(id)
        ? `<div class="prose">${unlocked.get(id)}</div>`
        : `<form class="unlock" data-unlock="${esc(id)}">
            <input type="password" placeholder="Password" autocomplete="off" aria-label="Password for ${esc(label)}">
            <button>Unlock</button><p class="unlock-msg"></p>
          </form>`;
      return `<details class="secret" data-secret="${esc(id)}"><summary><span class="closed">Reveal</span><span class="opened">Hide</span> ${esc(label)}</summary><div class="secret-body">${body}</div></details>`;
    }
    const encryptedFor = (id) => (id === "dm-notes" ? LORE.dmNotes.html : LORE.characters[id].secret);

    async function unlock(details, password, quiet) {
      const id = details.dataset.secret, msg = details.querySelector(".unlock-msg");
      if (!window.crypto?.subtle) {
        if (msg) msg.textContent = "Unlocking needs the https link (or localhost).";
        return false;
      }
      const result = await decryptSecret(encryptedFor(id), password);
      if (!result) {
        if (msg && !quiet) msg.textContent = "That's not it.";
        return false;
      }
      unlocked.set(id, result.html);
      rememberPassword(id, result.who, password);
      details.querySelector(".secret-body").innerHTML = `<div class="prose">${result.html}</div>`;
      return true;
    }

    // On opening a locked secret, quietly try passwords already entered in this tab.
    document.addEventListener("toggle", async (e) => {
      const details = e.target;
      if (!details.matches?.("details[data-secret]") || !details.open || unlocked.has(details.dataset.secret)) return;
      const saved = savedPasswords();
      for (const pw of [saved[details.dataset.secret], saved.master].filter(Boolean)) {
        if (await unlock(details, pw, true)) return;
      }
      details.querySelector(".unlock input")?.focus();
    }, true);

    document.addEventListener("submit", (e) => {
      const form = e.target.closest("form[data-unlock]");
      if (!form) return;
      e.preventDefault();
      const input = form.querySelector("input");
      form.querySelector(".unlock-msg").textContent = "Unlocking…";
      unlock(form.closest("details"), input.value, false).then((ok) => { if (!ok) input.select(); });
    });

    const sign = (n) => (typeof n === "number" ? (n < 0 ? "−" + Math.abs(n) : "+" + n) : n);
    const ABILITIES = ["str", "dex", "con", "int", "wis", "cha"];
    const spellLink = (name) => SPELLS[name] ? `<button class="spell" data-spell="${esc(name)}">${esc(name)}</button>` : esc(name);

    // Per-character play state, kept in this browser only:
    // { hp, temp, slots: { "1": used }, res: { "Lay on Hands": used } }
    const stateKey = (id) => `hollow-vigil:state:${id}`;
    function loadState(c) {
      let s = {};
      try { s = JSON.parse(localStorage.getItem(stateKey(c.id))) || {}; } catch {}
      return { hp: s.hp ?? c.stats.hp, temp: s.temp ?? 0, slots: s.slots || {}, res: s.res || {} };
    }
    function saveState(c, s) {
      try { localStorage.setItem(stateKey(c.id), JSON.stringify(s)); } catch {}
    }

    // A row of clickable pips; filled = available, hollow = spent (spent ones fill from the right).
    function pipRow(kind, key, max, used = 0) {
      return Array.from({ length: max }, (_, i) => {
        const spent = i >= max - used;
        return `<button class="pip${spent ? " spent" : ""}" data-pip="${kind}" data-key="${esc(key)}" data-index="${i}" data-max="${max}"
          aria-label="${esc(key)} ${i + 1}${spent ? ", spent" : ""}"></button>`;
      }).join("");
    }
    const ordinal = (n) => n + (["th", "st", "nd", "rd"][n] || "th");

    function list(title, items = [], wide = false) {
      if (!items.length) return `<section class="block"><h3>${title}</h3><p class="empty">—</p></section>`;
      const body = typeof items[0] === "string"
        ? `<ul class="chips">${items.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>`
        : `<dl>${items.map((i) => `<dt>${spellLink(i.name)}</dt><dd>${esc(i.text)}</dd>`).join("")}</dl>`;
      return `<section class="block${wide ? " wide" : ""}"><h3>${title}</h3>${body}</section>`;
    }

    // Six ability cells: modifier, score, and saving throw (● = proficient).
    function abilityRow(c) {
      if (!c.abilities) return "";
      const cells = ABILITIES.map((k) => {
        const a = c.abilities[k];
        const prof = (c.saves || []).includes(k);
        return `<div><span>${k}</span><b>${sign(Math.floor((a.score - 10) / 2))}</b><small>${a.score}</small>
          <em class="${prof ? "prof" : ""}">${prof ? "● " : ""}Save ${sign(a.save)}</em></div>`;
      }).join("");
      return `<div class="abilities">${cells}</div>${c.savesNote ? `<p class="note">${esc(c.savesNote)}</p>` : ""}`;
    }

    function attackList(attacks = []) {
      if (!attacks.length) return list("Attacks");
      return `<section class="block wide"><h3>Attacks</h3><table class="attacks">
        <tr><th>Weapon</th><th>Hit</th><th>Damage</th><th>Notes</th></tr>
        ${attacks.map((a) => `<tr><td>${esc(a.name)}</td><td>${sign(a.hit)}</td><td>${esc(a.damage)}</td><td>${esc(a.notes || "")}</td></tr>`).join("")}
      </table></section>`;
    }

    // Which spell list a character page shows when it has a quickList ("quick" or "all"); per browser.
    const viewKey = (id) => `hollow-vigil:spellview:${id}`;
    function loadView(id) {
      try { return localStorage.getItem(viewKey(id)) || "quick"; } catch { return "quick"; }
    }

    // Spells grouped by level; each level row carries its slot pips.
    // byLevel entries are a spell name, or { name, note } for things like "always prepared".
    // An optional quickList (array of names) adds a Quick list / All spells toggle.
    function spellBlock(c, st) {
      const sc = c.spellcasting;
      if (!sc) return "";
      const nameOf = (s) => (typeof s === "string" ? s : s.name);
      const all = Object.values(sc.byLevel || {}).flat();
      const quick = sc.quickList ? new Set(sc.quickList) : null;
      const view = quick ? loadView(c.id) : "all";
      const toggle = quick ? `<div class="spell-view">
          <button data-spellview="quick" class="${view === "quick" ? "on" : ""}">Quick list (${all.filter((s) => quick.has(nameOf(s))).length})</button>
          <button data-spellview="all" class="${view === "all" ? "on" : ""}">All spells (${all.length})</button>
        </div>` : "";
      const rows = Object.entries(sc.byLevel || {}).map(([lvl, levelSpells]) => {
        const spells = view === "quick" ? levelSpells.filter((s) => quick.has(nameOf(s))) : levelSpells;
        const slots = sc.slots?.[lvl];
        const chips = spells.map((s) => {
          const { name, note } = typeof s === "string" ? { name: s } : s;
          return `<li>${spellLink(name)}${note ? ` <small>${esc(note)}</small>` : ""}</li>`;
        }).join("");
        return `<div class="spell-row">
          <div class="spell-lvl">${lvl === "0" ? "Cantrips" : ordinal(+lvl)}${slots ? `<span class="pips">${pipRow("slot", lvl, slots, st.slots[lvl])}</span>` : ""}</div>
          <ul class="chips">${chips}</ul>
        </div>`;
      }).join("");
      return `<section class="block wide"><h3>Spellcasting</h3>
        <div class="spell-head">
          <p class="spell-meta">Save DC <b>${esc(sc.dc)}</b> · Spell attack <b>${sign(sc.attack)}</b></p>
          ${toggle}
        </div>
        ${rows}
      </section>`;
    }

    // Consumable items (potions etc.): pips tick off uses and never refill on a rest.
    function itemBlock(c, st) {
      if (!c.items?.length) return "";
      return `<section class="block wide"><h3>Items & Potions</h3><dl class="items">
        ${c.items.map((it) => `<dt>${esc(it.name)}${it.qty ? `<span class="pips">${pipRow("res", it.name, it.qty, st.res[it.name])}</span>` : ""}</dt>
          <dd>${esc(it.text)}</dd>`).join("")}
      </dl></section>`;
    }

    // HP, temp HP, limited-use resources and rest buttons.
    function tracker(c, st) {
      if (typeof c.stats.hp !== "number") return "";
      const max = c.stats.hp;
      const resources = (c.resources || []).map((r) => {
        const used = st.res[r.name] || 0;
        const ctrl = r.max <= 10
          ? `<span class="pips">${pipRow("res", r.name, r.max, used)}</span>`
          : `<span class="pool"><b>${r.max - used}</b> / ${r.max}
              <button data-res="${esc(r.name)}" data-step="-5">−5</button><button data-res="${esc(r.name)}" data-step="-1">−1</button><button data-res="${esc(r.name)}" data-step="1">+1</button></span>`;
        return `<div class="res"><span class="res-name">${esc(r.name)} <small>${r.recharge === "short" ? "short rest" : "long rest"}</small></span>${ctrl}</div>`;
      }).join("");
      return `<section class="tracker">
        <div class="hp-row">
          <div class="hp${st.hp <= max / 2 ? " bloodied" : ""}${st.hp === 0 ? " down" : ""}">
            <span>Hit Points</span><b>${st.hp}</b><i>/ ${max}</i>${st.temp ? `<em>+${st.temp} temp</em>` : ""}
          </div>
          <div class="hp-controls">
            <input id="hp-amount" type="number" min="0" inputmode="numeric" placeholder="Amount">
            <button data-hp="damage">Damage</button><button data-hp="heal">Heal</button><button data-hp="temp">Temp HP</button>
          </div>
        </div>
        ${resources ? `<div class="resources">${resources}</div>` : ""}
        <div class="rests"><button class="rest" data-rest="short">Short rest</button><button class="rest" data-rest="long">Long rest</button></div>
      </section>`;
    }

    function renderCharacter(c) {
      const i = CHARACTERS.indexOf(c);
      const prev = CHARACTERS[(i - 1 + CHARACTERS.length) % CHARACTERS.length];
      const next = CHARACTERS[(i + 1) % CHARACTERS.length];
      const s = c.stats;
      const l = lore(c);
      const st = loadState(c);
      document.title = `${l.name} · ${PREMISE.title}`;
      app.innerHTML = `
        <nav class="topnav">
          <a href="#/">← Roster</a>
          <span>
            <a href="#/${prev.id}">‹ ${esc(lore(prev).name)}</a>
            <a href="#/${next.id}">${esc(lore(next).name)} ›</a>
          </span>
        </nav>
        <article class="sheet">
          <div class="hero">
            <a href="${img(c.image)}" target="_blank" title="Open full size"><img class="portrait" src="${img(c.image)}" alt="${esc(l.name)}"></a>
            <div class="intro">
              <h2>${esc(l.name)}</h2>
              ${l.aka ? `<p class="aka">${esc(l.aka)}</p>` : ""}
              <p class="epithet">${esc(l.epithet)}</p>
              <div class="prose">${l.html}</div>
              ${l.secret ? secretBox(c.id, "Secret") : ""}
            </div>
          </div>
          <div class="rule"><span>✦</span></div>
          <div class="statline">
            <div><b>${esc(s.level)}</b><span>Level</span></div>
            ${typeof s.hp === "number" ? "" : `<div><b>${esc(s.hp)}</b><span>Hit Points</span></div>`}
            <div><b>${esc(s.ac)}</b><span>Armor Class</span></div>
            <div><b>${esc(s.speed)}</b><span>Speed</span></div>
            <div><b>${sign(s.initiative ?? "—")}</b><span>Initiative</span></div>
            <div><b>${esc(s.passivePerception ?? "—")}</b><span>Passive Perception</span></div>
          </div>
          ${abilityRow(c)}
          ${tracker(c, st)}
          <div class="blocks">
            ${list("Skills", c.skills, true)}
            ${attackList(c.attacks)}
            ${list("Actions", c.actions)}
            ${list("Bonus Actions", c.bonusActions)}
            ${list("Reactions", c.reactions)}
            ${list("Feats & Traits", c.feats)}
            ${itemBlock(c, st)}
            ${spellBlock(c, st)}
          </div>
        </article>`;
    }

    // DM-only page: content stays folded away until revealed, safe to have on a shared screen.
    function renderNotes() {
      const n = LORE.dmNotes;
      document.title = `${n.title} · ${PREMISE.title}`;
      app.innerHTML = `
        <nav class="topnav"><a href="#/">← Roster</a></nav>
        <article class="notes">
          <h2>${esc(n.title)}</h2>
          ${secretBox("dm-notes", "DM Notes")}
        </article>`;
    }

    function route() {
      const id = location.hash.replace(/^#\/?/, "");
      const c = CHARACTERS.find((x) => x.id === id);
      if (c) renderCharacter(c);
      else if (id === "dm-notes" && LORE.dmNotes) renderNotes();
      else if (id === "votes") renderVotes();
      else renderHome();
      window.scrollTo(0, 0);
    }

    const dialog = document.getElementById("spell-dialog");
    function showSpell(name) {
      const s = SPELLS[name];
      const lvl = s.level === 0 ? `${s.school} cantrip` : `Level ${s.level} ${s.school.toLowerCase()}${s.ritual ? " (ritual)" : ""}`;
      dialog.innerHTML = `
        <button class="close" aria-label="Close">×</button>
        <h3>${esc(name)}</h3>
        <p class="spell-level">${esc(lvl)}</p>
        <dl class="spell-facts">
          <dt>Casting time</dt><dd>${esc(s.time)}</dd>
          <dt>Range</dt><dd>${esc(s.range)}</dd>
          <dt>Components</dt><dd>${esc(s.components)}</dd>
          <dt>Duration</dt><dd>${esc(s.duration)}</dd>
        </dl>
        <p>${esc(s.text)}</p>
        ${s.higher ? `<p class="spell-higher"><b>At higher levels.</b> ${esc(s.higher)}</p>` : ""}`;
      dialog.showModal();
    }

    document.addEventListener("click", (e) => {
      const spell = e.target.closest("[data-spell]");
      if (spell) return showSpell(spell.dataset.spell);
      if (e.target === dialog || e.target.closest(".close")) return dialog.close();

      const id = location.hash.replace(/^#\/?/, "");
      const c = CHARACTERS.find((x) => x.id === id);
      if (!c) return;
      const view = e.target.closest("[data-spellview]");
      if (view) {
        try { localStorage.setItem(viewKey(c.id), view.dataset.spellview); } catch {}
        return renderCharacter(c);
      }

      const st = loadState(c);
      const max = c.stats.hp;
      const pip = e.target.closest("[data-pip]");
      const res = e.target.closest("[data-res]");
      const hp = e.target.closest("[data-hp]");
      const rest = e.target.closest("[data-rest]");

      if (pip) {
        // Clicking a filled pip spends down to it; clicking a spent pip restores up to it.
        const bucket = pip.dataset.pip === "slot" ? st.slots : st.res;
        const { key } = pip.dataset, i = +pip.dataset.index, n = +pip.dataset.max;
        bucket[key] = i >= n - (bucket[key] || 0) ? n - i - 1 : n - i;
      } else if (res) {
        const r = c.resources.find((x) => x.name === res.dataset.res);
        st.res[r.name] = Math.min(r.max, Math.max(0, (st.res[r.name] || 0) - +res.dataset.step));
      } else if (hp) {
        const amount = Math.max(0, parseInt(document.getElementById("hp-amount").value, 10) || 0);
        if (!amount) return;
        if (hp.dataset.hp === "damage") {
          const absorbed = Math.min(st.temp, amount);  // temp HP soaks damage first
          st.temp -= absorbed;
          st.hp = Math.max(0, st.hp - (amount - absorbed));
        } else if (hp.dataset.hp === "heal") {
          st.hp = Math.min(max, st.hp + amount);
        } else {
          st.temp = Math.max(st.temp, amount);  // temp HP don't stack; keep the higher
        }
      } else if (rest) {
        if (rest.dataset.rest === "long") {
          // Rests restore everything except consumable items.
          const kept = Object.fromEntries((c.items || []).filter((it) => it.name in st.res).map((it) => [it.name, st.res[it.name]]));
          Object.assign(st, { hp: max, temp: 0, slots: {}, res: kept });
        } else {
          for (const r of c.resources || []) if (r.recharge === "short") delete st.res[r.name];
        }
      } else return;
      saveState(c, st);
      renderCharacter(c);
    });

    // Arrow keys flip between characters.
    document.addEventListener("keydown", (e) => {
      if (dialog.open) return;  // Esc closes the popup instead of leaving the page
      if (e.target.matches("input, textarea")) return;  // typing in the HP box shouldn't flip pages
      const id = location.hash.replace(/^#\/?/, "");
      const i = CHARACTERS.findIndex((x) => x.id === id);
      if (i < 0) return;
      if (e.key === "ArrowRight") location.hash = "/" + CHARACTERS[(i + 1) % CHARACTERS.length].id;
      if (e.key === "ArrowLeft") location.hash = "/" + CHARACTERS[(i - 1 + CHARACTERS.length) % CHARACTERS.length].id;
      if (e.key === "Escape") location.hash = "/";
    });

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
